# ─────────────────────────────────────────────────────────────────────────────
# RTABMap Parameters for ZED Camera + 2D LiDAR
# ─────────────────────────────────────────────────────────────────────────────
#
# Tuning guide:
#   Mem/recentWmRatio        — how much short-term memory to keep
#   Kp/MaxFeatures           — number of visual features tracked (lower = faster)
#   RGBD/LoopClosureReextractFeatures — re-extract on loop close for accuracy
#
# Full parameter list:
#   http://wiki.ros.org/rtabmap_ros/Tutorials/Advanced%20Parameter%20Tuning
# ─────────────────────────────────────────────────────────────────────────────

rtabmap:
  ros__parameters:

    # ── Frame IDs ─────────────────────────────────────────────────────────────
    frame_id:        "base_link"    # robot body frame
    odom_frame_id:   "odom"         # odometry frame published by ZED
    map_frame_id:    "map"          # global map frame RTABMap will build

    # ── Input topic remappings (set here or in launch file) ───────────────────
    # rgb/image         → /zed/zed_node/left/image_rect_color
    # rgb/camera_info   → /zed/zed_node/left/camera_info
    # depth/image       → /zed/zed_node/depth/depth_registered
    # odom              → /zed/zed_node/odom
    # scan              → /scan

    # ── Map update rate ───────────────────────────────────────────────────────
    # How often (seconds) RTABMap updates the map.
    # Lower = more responsive but more CPU.
    Rtabmap/TimeThr:          "0"      # 0 = no time limit per iteration
    Rtabmap/DetectionRate:    "1.0"    # map update frequency (Hz)

    # ── Loop closure ─────────────────────────────────────────────────────────
    # Loop closure is how RTABMap recognises "I've been here before"
    # and corrects accumulated drift in the map.
    Mem/IncrementalMemory:    "true"
    Mem/STMSize:              "30"     # short-term memory size (nodes)
    Kp/MaxFeatures:           "500"    # visual features to extract per frame

    # ── LiDAR scan matching ───────────────────────────────────────────────────
    # ICP (Iterative Closest Point) aligns consecutive LiDAR scans.
    RGBD/ProximityBySpace:    "true"   # use LiDAR for local proximity detection
    Icp/MaxCorrespondenceDistance: "0.1"
    Icp/VoxelSize:            "0.05"   # downsample point cloud (meters)

    # ── Odometry source ───────────────────────────────────────────────────────
    # We use ZED's built-in visual-inertial odometry, so RTABMap
    # does NOT need to compute its own odometry.
    subscribe_depth:          "true"
    subscribe_scan:           "true"
    odom_sensor_sync:         "true"

    # ── Map saving ────────────────────────────────────────────────────────────
    # RTABMap saves its database here — you can reload a previous map.
    database_path:    "/media/wolfwagen1/c9c2a9fe-c435-4115-9237-57bc783cf964/rtabmap.db"